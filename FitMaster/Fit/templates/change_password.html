<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ role_label }} Change Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
    <link rel="stylesheet" href="{% static 'css/templates/change_password.css' %}">
</head>
<body>
  <div class="card-shell">
    <div class="eyebrow"><i class="fas fa-key"></i>{{ role_label }} Password</div>
    <h1 style="margin:18px 0 10px;font-size:2rem;font-weight:800;">Change your password</h1>
    <p style="color:rgba(255,255,255,0.7);margin-bottom:20px;">You are changing the password for the currently logged-in account.</p>

    {% if Error %}
      <div class="notice"><i class="fas fa-circle-exclamation me-2"></i>{{ Error }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label>Account</label>
        <input type="text" value="{{ account_email }}" readonly>
      </div>
      <div class="field">
        <label>New Password</label>
        <input type="password" name="new_password" required>
      </div>
      <div class="field">
        <label>Confirm New Password</label>
        <input type="password" name="confirm_password" required>
      </div>
      <button type="submit" class="primary-btn"><i class="fas fa-floppy-disk me-2"></i>Update Password</button>
    </form>

    <div style="text-align:center;margin-top:16px;color:rgba(255,255,255,0.7);">
      Back to login? <a href="{% url login_url_name %}" style="color:#f8c84b;text-decoration:none;font-weight:700;">Go here</a>
    </div>
  </div>
</body>
</html>
