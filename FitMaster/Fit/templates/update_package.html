{% extends "adminnav.html" %}
{% load static %}
{% block title %}Edit Package{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/templates/update_package.css' %}">
{% endblock %}
{% block navitems %}


<div class="form-container">
    <div class="form-card">
        <div class="form-header">
            <h2><i class="fas fa-edit"></i> Edit Package</h2>
            <p>Update package details</p>
        </div>
        
       
        
        <form method="post" action="{% url "update_package" pack.id %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label"><i class="fas fa-tag"></i> Package Name <span class="required">*</span></label>
                <input type="text" name="name" class="form-control" value="{{ pack.name }}" required>
            </div>
            
            <div class="form-group">
                <label class="form-label"><i class="fas fa-calendar-alt"></i> Duration (Months) <span class="required">*</span></label>
                <input type="number" name="duration_months" class="form-control" value="{{ pack.duration_months }}" min="1" max="24" required>
            </div>
            
            <div class="form-group">
            <label class="form-label"><i class="fas fa-rupee-sign"></i> Price (Rs.) <span class="required">*</span></label>
                <input type="number" name="price" class="form-control" value="{{ pack.price }}" step="0.01" required>
            </div>
            
            <div class="form-group">
                <label class="form-label"><i class="fas fa-align-left"></i> Description <span class="required">*</span></label>
                <textarea name="description" class="form-control" rows="5" required>{{ pack.description }}</textarea>
            </div>
            
            <button type="submit" class="btn-submit">
                <i class="fas fa-save"></i> Update Package
            </button>
            
            <a href="{% url 'adminpackage' %}" class="btn-cancel">
                <i class="fas fa-times"></i> Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
