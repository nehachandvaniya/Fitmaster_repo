{% extends "trainernav.html" %}
{% load static %}
{% block title %}Edit Exercise Plan{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/templates/edit_exercise_plan.css' %}">
{% endblock %}
{% block trainer_content %}
<div class="page-head">
  <div>
    <h1>Edit Exercise Plan</h1>
    <p>Update the exercise routine for one of your assigned customers.</p>
  </div>
  <a href="{% url 'trainer_assign_exercise' %}" class="btn-gold"><i class="fas fa-arrow-left"></i>Back</a>
</div>

<div class="panel">
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="mb-2">Customer</label>
      <select name="customer_id" class="select-glass" required>
        {% for membership in memberships %}
        <option value="{{ membership.customer.id }}" {% if exercise_plan.customer.id == membership.customer.id %}selected{% endif %}>{{ membership.customer.firstname }} {{ membership.customer.lastname }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="mb-2">Exercise Name</label>
      <input type="text" name="exercise_name" value="{{ exercise_plan.exercise_name }}" class="input-glass" required>
    </div>
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="mb-2">Sets</label>
        <input type="number" name="sets" value="{{ exercise_plan.sets }}" class="input-glass" required>
      </div>
      <div class="col-md-6">
        <label class="mb-2">Reps</label>
        <input type="number" name="reps" value="{{ exercise_plan.reps }}" class="input-glass" required>
      </div>
    </div>
    <div class="mb-4">
      <label class="mb-2">Instructions</label>
      <textarea name="instructions" class="textarea-glass" required>{{ exercise_plan.instructions }}</textarea>
    </div>
    <button type="submit" class="btn-gold"><i class="fas fa-floppy-disk"></i>Update Exercise Plan</button>
  </form>
</div>
{% endblock %}
